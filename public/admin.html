<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Gallery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PRIVATE GALLERY</div>
      <h1>Manage Images</h1>
    </div>
    <nav>
      <a class="ghost-button" href="/gallery.html">Gallery</a>
      <button class="ghost-button" id="logout">Lock</button>
    </nav>
  </header>

  <main class="admin-wrap">
    <section class="upload-panel">
      <div>
        <div class="eyebrow">UPLOAD</div>
        <h2>Add new images</h2>
        <p>Choose up to 20 images at once. Maximum 15 MB per image.</p>
      </div>

      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <span class="drop-icon">＋</span>
        <strong>Choose images</strong>
        <small>or drag & drop them here</small>
      </label>

      <div id="selected" class="selected"></div>
      <button id="uploadButton" class="button" disabled>Upload images</button>
      <p id="status" class="message" aria-live="polite"></p>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <div class="eyebrow">LIBRARY</div>
          <h2>Current images</h2>
        </div>
        <span id="count" class="count"></span>
      </div>
      <div id="adminGallery" class="gallery"></div>
    </section>
  </main>

  <script>
    const input = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const selected = document.getElementById("selected");
    const uploadButton = document.getElementById("uploadButton");
    const status = document.getElementById("status");
    const adminGallery = document.getElementById("adminGallery");
    const count = document.getElementById("count");
    let files = [];

    function setFiles(list) {
      files = [...list].slice(0, 20);
      selected.textContent = files.length
        ? files.map(f => f.name).join(" • ")
        : "No images selected";
      uploadButton.disabled = files.length === 0;
    }

    input.addEventListener("change", () => setFiles(input.files));

    ["dragenter", "dragover"].forEach(event =>
      dropzone.addEventListener(event, e => {
        e.preventDefault();
        dropzone.classList.add("dragging");
      })
    );

    ["dragleave", "drop"].forEach(event =>
      dropzone.addEventListener(event, e => {
        e.preventDefault();
        dropzone.classList.remove("dragging");
      })
    );

    dropzone.addEventListener("drop", e => setFiles(e.dataTransfer.files));

    uploadButton.addEventListener("click", async () => {
      const formData = new FormData();
      files.forEach(file => formData.append("images", file));
      uploadButton.disabled = true;
      status.textContent = "Uploading…";

      const response = await fetch("/api/upload", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (response.ok) {
        status.textContent = `${data.uploaded.length} image(s) uploaded.`;
        setFiles([]);
        input.value = "";
        loadImages();
      } else {
        status.textContent = data.error || "Upload failed.";
        uploadButton.disabled = false;
      }
    });

    async function loadImages() {
      const response = await fetch("/api/images");
      if (response.status === 401) return location.href = "/";
      const images = await response.json();
      count.textContent = `${images.length} image${images.length === 1 ? "" : "s"}`;
      adminGallery.innerHTML = "";

      images.forEach(image => {
        const card = document.createElement("div");
        card.className = "admin-card";
        card.innerHTML = `
          <img src="${image.url}" alt="">
          <button class="delete-button" title="Delete image">Delete</button>
        `;
        card.querySelector("button").onclick = async () => {
          if (!confirm("Delete this image?")) return;
          const response = await fetch(
            "/api/images/" + encodeURIComponent(image.name),
            {method: "DELETE"}
          );
          if (response.ok) loadImages();
        };
        adminGallery.appendChild(card);
      });
    }

    document.getElementById("logout").onclick = async () => {
      await fetch("/api/logout", {method: "POST"});
      location.href = "/";
    };

    loadImages();
  </script>
</body>
</html>
