<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PRIVATE GALLERY</div>
      <h1>My Images</h1>
    </div>
    <nav>
      <a class="ghost-button" href="/admin.html">Upload</a>
      <button class="ghost-button" id="logout">Lock</button>
    </nav>
  </header>

  <main class="gallery-wrap">
    <div id="empty" class="empty" hidden>
      <h2>No images yet</h2>
      <p>Open Upload to add your first images.</p>
      <a class="button" href="/admin.html">Add images</a>
    </div>
    <section id="gallery" class="gallery" aria-live="polite"></section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="closeLightbox" class="lightbox-close" aria-label="Close">×</button>
    <button id="prev" class="lightbox-nav prev" aria-label="Previous">‹</button>
    <img id="lightboxImage" alt="">
    <button id="next" class="lightbox-nav next" aria-label="Next">›</button>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const empty = document.getElementById("empty");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    let images = [];
    let current = 0;

    async function loadImages() {
      const response = await fetch("/api/images");
      if (response.status === 401) return location.href = "/";
      images = await response.json();

      gallery.innerHTML = "";
      empty.hidden = images.length !== 0;

      images.forEach((image, index) => {
        const card = document.createElement("button");
        card.className = "image-card";
        card.type = "button";
        card.innerHTML = `<img loading="lazy" src="${image.url}" alt="Gallery image ${index + 1}">`;
        card.addEventListener("click", () => openLightbox(index));
        gallery.appendChild(card);
      });
    }

    function openLightbox(index) {
      current = index;
      lightboxImage.src = images[current].url;
      lightbox.hidden = false;
      document.body.classList.add("no-scroll");
    }

    function closeLightbox() {
      lightbox.hidden = true;
      document.body.classList.remove("no-scroll");
      lightboxImage.src = "";
    }

    function move(step) {
      if (!images.length) return;
      current = (current + step + images.length) % images.length;
      lightboxImage.src = images[current].url;
    }

    document.getElementById("closeLightbox").onclick = closeLightbox;
    document.getElementById("prev").onclick = () => move(-1);
    document.getElementById("next").onclick = () => move(1);

    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", e => {
      if (lightbox.hidden) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") move(-1);
      if (e.key === "ArrowRight") move(1);
    });

    document.getElementById("logout").onclick = async () => {
      await fetch("/api/logout", {method: "POST"});
      location.href = "/";
    };

    loadImages();
  </script>
</body>
</html>
