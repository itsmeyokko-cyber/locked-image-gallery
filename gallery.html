<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gallery</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">PRIVATE GALLERY</div><h1>My Images</h1></div>
  <nav><a class="ghost-button" href="./admin.html">Manage</a><button class="ghost-button" id="logout">Lock</button></nav>
</header>
<main class="gallery-wrap">
  <div id="empty" class="empty" hidden>
    <h2>No images yet</h2>
    <p>Add image files to the <code>images</code> folder and list them in <code>images.json</code>.</p>
    <a class="button" href="./admin.html">How to add images</a>
  </div>
  <section id="gallery" class="gallery" aria-live="polite"></section>
</main>
<div id="lightbox" class="lightbox" hidden>
  <button id="closeLightbox" class="lightbox-close" aria-label="Close">×</button>
  <button id="prev" class="lightbox-nav prev" aria-label="Previous">‹</button>
  <img id="lightboxImage" alt="">
  <button id="next" class="lightbox-nav next" aria-label="Next">›</button>
</div>
<script>
if (sessionStorage.getItem("galleryUnlocked") !== "1") location.href = "./index.html";
const gallery=document.getElementById("gallery"), empty=document.getElementById("empty"), lightbox=document.getElementById("lightbox"), lightboxImage=document.getElementById("lightboxImage");
let images=[], current=0;
async function loadImages(){
  try {
    const r=await fetch("./images.json", {cache:"no-store"});
    if(!r.ok) throw new Error();
    images=await r.json();
  } catch(e) { images=[]; }
  gallery.innerHTML=""; empty.hidden=images.length!==0;
  images.forEach((image,index)=>{
    const src="./images/"+encodeURIComponent(image.name);
    const card=document.createElement("button"); card.className="image-card"; card.type="button";
    const img=document.createElement("img"); img.loading="lazy"; img.src=src; img.alt="Gallery image "+(index+1);
    card.appendChild(img); card.addEventListener("click",()=>openLightbox(index)); gallery.appendChild(card);
  });
}
function openLightbox(i){current=i; lightboxImage.src="./images/"+encodeURIComponent(images[current].name); lightbox.hidden=false; document.body.classList.add("no-scroll");}
function closeLightbox(){lightbox.hidden=true;document.body.classList.remove("no-scroll");lightboxImage.src="";}
function move(step){if(!images.length)return;current=(current+step+images.length)%images.length;lightboxImage.src="./images/"+encodeURIComponent(images[current].name);}
document.getElementById("closeLightbox").onclick=closeLightbox; document.getElementById("prev").onclick=()=>move(-1); document.getElementById("next").onclick=()=>move(1);
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox();});
document.addEventListener("keydown",e=>{if(lightbox.hidden)return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);});
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("galleryUnlocked");location.href="./index.html";};
loadImages();
</script>
</body></html>
